search:
  scoring:
    # Profile completeness bonuses
    identity_base: 10        # has name or display_name
    about_bonus: 10          # about > min_about_length chars
    picture_bonus: 30        # has http picture URL

    # Penalties
    hex_name_penalty: -100   # name is exactly 64 hex chars (lazy bot)
    gibberish_penalty: -200  # name > min_gibberish_length with no vowels
    ghost_penalty: -500      # no name, about, or picture

    # Thresholds
    min_about_length: 15     # minimum about length to earn about_bonus
    min_gibberish_length: 6  # minimum name length for gibberish check

  verification:
    nip05_score: 50          # base score for verified NIP-05
    lud16_score: 20          # base score for verified LUD-16
    lud16_chain_limit: 40    # maximum score for multiple chains (e.g. 2x lud16_score)

  engine:
    max_total_hits: 10000
    typo_one_min_word_size: 5
    typo_two_min_word_size: 9
    about_max_length: 1024   # truncation limit for about field

  social:
    followers_weight: 20     # x log10(1 + followers)
    followers_cap: 100
    zaps_weight: 20          # x log10(1 + sender-weighted sats received)
    zappers_weight: 10       # x log10(1 + sender-weighted distinct zappers)
    zaps_cap: 100
    per_sender_cap: 100000   # most sats one sender can add
    trusted_sender_score: 60 # sender score that counts fully
    min_sender_factor: 0.1   # weight of a sender with no score
