name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The MinIO the "Start MinIO" step runs, for the nipB7/server S3 tests.
      NIPB7_S3_ENDPOINT: 127.0.0.1:9000
      NIPB7_S3_BUCKET: nipb7-test
      NIPB7_S3_ACCESS_KEY: nmilat-test
      NIPB7_S3_SECRET_KEY: nmilat-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Start MinIO
        # Object storage for the nipB7/server S3 tests. A docker run step,
        # not a service container: the image needs "server /data" as its
        # command, which services cannot pass. MinIO no longer publishes
        # pullable images on Docker Hub or Quay, so this is Chainguard's
        # build, pinned by digest.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$NIPB7_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$NIPB7_S3_SECRET_KEY" \
            cgr.dev/chainguard/minio@sha256:a1ac4589a5f8136b616e667b48a0bea9719bb10bd45799ea946f24bbedfafde4 \
            server /data
          for i in $(seq 1 30); do
            curl -fsS "http://$NIPB7_S3_ENDPOINT/minio/health/ready" && break
            sleep 1
          done
          curl -fsS "http://$NIPB7_S3_ENDPOINT/minio/health/ready"
          curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user "$NIPB7_S3_ACCESS_KEY:$NIPB7_S3_SECRET_KEY" \
            -X PUT "http://$NIPB7_S3_ENDPOINT/$NIPB7_S3_BUCKET"

      - name: Test
        # relay alone takes ~11m under -race; go test's default is 10m
        run: go test -race -timeout 40m ./...

      - name: S3 tests ran
        # The S3 tests skip without NIPB7_S3_ENDPOINT; make sure they did not.
        # tee prints the output before pipefail fails the step on a failed
        # test; a skipped one leaves no PASS line for grep to find.
        run: |
          out="$RUNNER_TEMP/s3.out"
          go test -count=1 -run S3 -v ./nipB7/server/ 2>&1 | tee "$out"
          for t in TestS3StoreContract TestServerOverS3; do
            grep -q -- "--- PASS: $t" "$out" || { echo "::error::$t did not pass"; exit 1; }
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Legacy markers
        run: scripts/legacy-check.sh

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
